<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Conflict Events Map</title>
    <!-- We include Bootstrap to make it look nice and Leaflet for the map -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 80vh; width: 100%; border-bottom: 3px solid #333; }
        .info-box { padding: 20px; text-align: center; }
        .back-btn { text-decoration: none; padding: 10px 20px; background: #333; color: white; border-radius: 5px; }
        .back-btn:hover { background: #555; }
    </style>
</head>
<body>

    <!-- This is where the map will appear -->
    <div id="map"></div>

    <div class="info-box container">
        <h1>Global Conflict Events Map</h1>
        <p>This map shows a sample of conflict events worldwide. Circles represent events, and their size shows the severity (number of deaths).</p>
        <a href="index.html" class="back-btn">Back to Home</a>
    </div>

    <!-- Load Leaflet and our data -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/global_conflict_data.js"></script>

    <script>
        // 1. Initialize the map (centered on the world)
        const map = L.map('map').setView([20, 0], 2);

        // 2. Add a background (tiles)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // 3. Loop through our data and add circles
        globalConflictData.forEach(event => {
            // Determine circle size based on deaths (minimum size of 5)
            const radius = Math.sqrt(parseInt(event.deaths) || 1) * 2 + 5;

            const circle = L.circleMarker([event.lat, event.lng], {
                radius: radius,
                fillColor: "#ff4444",
                color: "#990000",
                weight: 1,
                opacity: 1,
                fillOpacity: 0.6
            }).addTo(map);

            // 4. Add a popup with the details
            circle.bindPopup(`
                <strong>Country:</strong> ${event.country}<br>
                <strong>Date:</strong> ${event.date}<br>
                <strong>Cause:</strong> ${event.cause}<br>
                <strong>Severity:</strong> ${event.deaths} total deaths<br>
                <strong>Civilian Deaths:</strong> ${event.civ_deaths}
            `);
        });
    </script>
</body>
</html>
