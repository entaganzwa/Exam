<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mali: Conflict Risk Assessment</title>
    
    <!-- Professional Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --conflict-red: #e63946;
            --risk-red: #800000;
            --safe-blue: #457b9d;
            --text-dark: #1d3557;
            --bg-light: #f1faee;
        }

        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }

        #map { 
            height: 100vh; 
            width: 100vw; 
            z-index: 1;
        }

        /* Modern Legend Styling */
        .legend {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            padding: 15px;
            line-height: 24px;
            color: var(--text-dark);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid rgba(0,0,0,0.05);
            font-size: 13px;
        }
        .legend h4 {
            margin: 0 0 10px 0;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 11px;
            color: #666;
        }
        .legend i {
            width: 12px;
            height: 12px;
            float: left;
            margin: 6px 10px 0 0;
            border-radius: 50%;
        }

        /* Filter Control Styling */
        .filter-control {
            background: white;
            padding: 12px 18px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-size: 14px;
            color: var(--text-dark);
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }
        .filter-control:hover {
            border-color: var(--risk-red);
        }
        .filter-control input {
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: var(--risk-red);
        }

        /* Clean Popup Styling */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            padding: 5px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .leaflet-popup-content {
            font-size: 14px;
            line-height: 1.6;
            margin: 12px;
        }
        .popup-header {
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }
        .popup-title {
            font-weight: 700;
            font-size: 16px;
            color: var(--text-dark);
            margin-bottom: 10px;
            display: block;
        }
        .popup-row {
            margin-bottom: 4px;
            color: #555;
        }
        .popup-row b {
            color: var(--text-dark);
        }

        /* Layer Control Styling */
        .leaflet-control-layers {
            border-radius: 12px !important;
            border: none !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1) !important;
            padding: 8px 12px !important;
        }
        
        /* Floating Title Info */
        .map-title {
            position: absolute;
            top: 20px;
            left: 50px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            pointer-events: none;
        }
        .map-title h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-dark);
        }
        .map-title p {
            margin: 5px 0 0 0;
            font-size: 13px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="map-title">
        <h1>Mali: Education at Risk</h1>
        <p>Analyzing school infrastructure within 1km of conflict zones</p>
        <div style="margin-top: 10px;">
            <a href="dashboard.html" style="text-decoration: none; color: #457b9d; font-weight: 700; font-size: 12px; display: flex; align-items: center; gap: 5px;">
                📊 View Global Data Dashboard →
            </a>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/data.js"></script>
    <script src="js/schools_near.js"></script>
    <script src="js/schools_far.js"></script>

    <script>
        // 1. Initialize Map
        const map = L.map('map', {
            zoomControl: false 
        }).setView([17.0, -4.0], 6);

        L.control.zoom({ position: 'topright' }).addTo(map);

        // 2. Base Maps
        const lightMap = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        const darkMap = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        });

        // 3. Layer Groups
        const conflictLayer = L.layerGroup();
        const schoolsNearLayer = L.layerGroup();
        const schoolsFarLayer = L.layerGroup();

        // 4. Load Conflict Events
        conflictData.forEach(event => {
            const radius = Math.sqrt(event.damages) * 1.5 + 4;
            const circle = L.circleMarker([event.lat, event.lng], {
                radius: radius,
                color: '#e63946',
                weight: 1,
                fillColor: '#e63946',
                fillOpacity: 0.4
            });

            const popupContent = `
                <span class="popup-header" style="color: #e63946;">Conflict Event</span>
                <span class="popup-title">${event.cause}</span>
                <div class="popup-row"><b>Location:</b> ${event.location}</div>
                <div class="popup-row"><b>Date:</b> ${event.date}</div>
                <div class="popup-row"><b>Fatalities:</b> ${event.damages}</div>
            `;
            circle.bindPopup(popupContent);
            conflictLayer.addLayer(circle);
        });

        // 5. Function to create school markers
        function createSchoolMarker(feature, color, isAtRisk) {
            const coords = feature.geometry.coordinates;
            const props = feature.properties;
            const circle = L.circleMarker([coords[1], coords[0]], {
                radius: 5,
                color: color,
                weight: 1.5,
                fillColor: color,
                fillOpacity: 0.7
            });

            const statusText = isAtRisk ? 
                `<div class="popup-row" style="color: #800000; font-weight: 700; margin-top: 10px;">⚠️ AT RISK (Within 1km of conflict)</div>` :
                `<div class="popup-row" style="color: #457b9d; font-weight: 600; margin-top: 10px;">✓ Safe distance from known conflicts</div>`;

            const popupContent = `
                <span class="popup-header" style="color: ${color};">Educational Facility</span>
                <span class="popup-title">${props.name || 'Unnamed School'}</span>
                <div class="popup-row"><b>Type:</b> ${props.amenity || 'N/A'}</div>
                <div class="popup-row"><b>OSM ID:</b> ${props.osm_id}</div>
                ${statusText}
            `;
            circle.bindPopup(popupContent);
            return circle;
        }

        // 6. Load Schools
        schoolsNearConflict.features.forEach(f => {
            schoolsNearLayer.addLayer(createSchoolMarker(f, '#800000', true));
        });
        schoolsFarFromConflict.features.forEach(f => {
            schoolsFarLayer.addLayer(createSchoolMarker(f, '#457b9d', false));
        });

        // 7. Initial Add
        conflictLayer.addTo(map);
        schoolsNearLayer.addTo(map);
        schoolsFarLayer.addTo(map);

        // 8. Layer Controls
        const baseMaps = { "Light Theme": lightMap, "Dark Theme": darkMap };
        const overlayMaps = {
            "Conflict Zones": conflictLayer,
            "At-Risk Schools": schoolsNearLayer,
            "Other Schools": schoolsFarLayer
        };
        L.control.layers(baseMaps, overlayMaps, { collapsed: false, position: 'topright' }).addTo(map);

        // 9. Filter UI
        const filterControl = L.control({ position: 'topleft' });
        filterControl.onAdd = function() {
            const div = L.DomUtil.create('div', 'filter-control');
            div.innerHTML = `
                <input type="checkbox" id="riskFilter">
                <label for="riskFilter">Show ONLY At-Risk Schools</label>
            `;
            L.DomEvent.disableClickPropagation(div);
            return div;
        };
        filterControl.addTo(map);

        document.getElementById('riskFilter').addEventListener('change', function(e) {
            if (e.target.checked) {
                map.removeLayer(schoolsFarLayer);
                map.removeLayer(conflictLayer);
            } else {
                schoolsFarLayer.addTo(map);
                conflictLayer.addTo(map);
            }
        });

        // 10. Legend
        const legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            const div = L.DomUtil.create('div', 'legend');
            div.innerHTML += '<h4>Map Legend</h4>';
            div.innerHTML += '<i style="background: #e63946; opacity: 0.5;"></i> Conflict Incidents<br>';
            div.innerHTML += '<i style="background: #800000;"></i> At-Risk Schools (≤1km)<br>';
            div.innerHTML += '<i style="background: #457b9d;"></i> Other Schools (>1km)<br>';
            return div;
        };
        legend.addTo(map);
    </script>
</body>
</html>
