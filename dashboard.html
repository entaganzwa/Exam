<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Conflict Dashboard</title>
    <!-- Bootstrap for styling (cards and layout) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js for the charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --conflict-red: #e63946;
            --risk-red: #800000;
            --safe-blue: #457b9d;
            --text-dark: #1d3557;
            --bg-light: #f1faee;
            --card-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        body {
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            padding-top: 20px;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            margin-bottom: 30px;
            transition: transform 0.2s;
            background: white;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card-title {
            font-weight: 700;
            color: var(--text-dark);
            border-bottom: 2px solid #f1f1f1;
            padding-bottom: 15px;
            margin-bottom: 20px;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .container {
            max-width: 1200px;
        }
        .dashboard-header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            margin-bottom: 40px;
            position: relative;
        }
        .dashboard-header h1 {
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 10px;
        }
        .dashboard-header p {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 0;
        }
        .return-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            text-decoration: none;
            color: var(--safe-blue);
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: 2px solid var(--safe-blue);
            border-radius: 30px;
            transition: all 0.2s;
        }
        .return-btn:hover {
            background: var(--safe-blue);
            color: white;
        }
        .data-link {
            text-decoration: none;
            color: var(--text-dark);
            display: block;
            padding: 10px;
            border-radius: 8px;
            background: #f1f1f1;
            margin-bottom: 10px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .data-link:hover {
            background: #e2e2e2;
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="dashboard-header">
            <a href="index.html" class="return-btn">← Back to Portal</a>
            <h1>Global Conflict Data Insights</h1>
            <p>Visualizing trends and impact of conflict events worldwide</p>
        </header>

        <div class="row">
            <!-- Chart 1: Top 10 Countries -->
            <div class="col-md-6">
                <div class="card p-4">
                    <h5 class="card-title">Top 10 Countries by Conflict Events</h5>
                    <canvas id="chartCountries"></canvas>
                </div>
            </div>

            <!-- Chart 2: Events per Year -->
            <div class="col-md-6">
                <div class="card p-4">
                    <h5 class="card-title">Conflict Events Over Time</h5>
                    <canvas id="chartYears"></canvas>
                </div>
            </div>

            <!-- Chart 3: Events by Category -->
            <div class="col-md-6">
                <div class="card p-4">
                    <h5 class="card-title">Conflict Events by Category</h5>
                    <canvas id="chartCategories"></canvas>
                </div>
            </div>

            <!-- Chart 4: Fatalities per Year -->
            <div class="col-md-6">
                <div class="card p-4">
                    <h5 class="card-title">Total Fatalities Over Time</h5>
                    <canvas id="chartFatalities"></canvas>
                </div>
            </div>
        </div>

        <footer class="text-center mt-5 mb-5">
            <p class="text-muted small">Data Source: GEDEvent v25.1 Cleaned CSV</p>
        </footer>
    </div>

    <script>
        // We use 'fetch' to load the data we processed with Python
        fetch('js/dashboard_data.json')
            .then(response => response.json())
            .then(data => {
                createCharts(data);
            });

        function createCharts(data) {
            // Chart 1: Countries (Bar)
            const countryLabels = Object.keys(data.top_countries);
            const countryValues = Object.values(data.top_countries);
            
            new Chart(document.getElementById('chartCountries'), {
                type: 'bar',
                data: {
                    labels: countryLabels,
                    datasets: [{
                        label: 'Number of Events',
                        data: countryValues,
                        backgroundColor: '#3498db',
                        borderRadius: 5
                    }]
                },
                options: {
                    indexAxis: 'y', // Horizontal bar chart
                    plugins: { legend: { display: false } }
                }
            });

            // Chart 2: Years (Line)
            const yearLabels = Object.keys(data.events_per_year);
            const yearValues = Object.values(data.events_per_year);

            new Chart(document.getElementById('chartYears'), {
                type: 'line',
                data: {
                    labels: yearLabels,
                    datasets: [{
                        label: 'Number of Events',
                        data: yearValues,
                        borderColor: '#e67e22',
                        backgroundColor: 'rgba(230, 126, 34, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                }
            });

            // Chart 3: Categories (Bar/Doughnut)
            const catLabels = Object.keys(data.categories);
            const catValues = Object.values(data.categories);

            new Chart(document.getElementById('chartCategories'), {
                type: 'bar',
                data: {
                    labels: catLabels,
                    datasets: [{
                        label: 'Number of Events',
                        data: catValues,
                        backgroundColor: ['#2ecc71', '#9b59b6', '#f1c40f'],
                        borderRadius: 5
                    }]
                },
                options: {
                    plugins: { legend: { display: false } }
                }
            });

            // Chart 4: Fatalities (Bar)
            const fatLabels = Object.keys(data.fatalities_per_year);
            const fatValues = Object.values(data.fatalities_per_year);

            new Chart(document.getElementById('chartFatalities'), {
                type: 'bar',
                data: {
                    labels: fatLabels,
                    datasets: [{
                        label: 'Total Fatalities',
                        data: fatValues,
                        backgroundColor: '#e74c3c',
                        borderRadius: 5
                    }]
                }
            });
        }
    </script>
</body>
</html>
