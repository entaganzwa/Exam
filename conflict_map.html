<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mali: Conflict & School Risk Map</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --conflict-red: #e63946;
            --risk-red: #800000;
            --safe-blue: #457b9d;
            --text-dark: #1d3557;
            --bg-light: #f1f4f8;
        }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; }
        
        .map-overlay {
            position: absolute;
            top: 20px;
            left: 50px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            max-width: 350px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.3);
        }

        .return-btn { 
            display: inline-block;
            text-decoration: none; 
            color: #457b9d; 
            font-weight: 700; 
            font-size: 13px;
            margin-bottom: 15px;
            transition: all 0.2s; 
        }
        .return-btn:hover { color: #1d3557; transform: translateX(-3px); }

        .legend { 
            background: white; 
            padding: 15px; 
            border-radius: 10px; 
            box-shadow: 0 2px 15px rgba(0,0,0,0.1); 
            line-height: 24px; 
            font-size: 13px; 
            color: #444;
        }
        .legend-item { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
        .legend i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
        
        .filter-container {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .custom-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
        }
        .custom-checkbox input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--risk-red);
        }

        .leaflet-popup-content-wrapper { border-radius: 8px; padding: 5px; }
        .leaflet-popup-content b { font-size: 14px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="map-overlay">
        <a href="index.html" class="return-btn">← Back to Portal</a>
        <h1 style="font-weight: 800; color: var(--text-dark); margin: 0; font-size: 22px; letter-spacing: -0.5px;">Mali Risk Map</h1>
        <p style="color: #666; margin: 8px 0 0 0; font-size: 13px; line-height: 1.4;">Visualizing conflict incidents and school safety zones across the region.</p>
        
        <div class="filter-container">
            <label class="custom-checkbox">
                <input type="checkbox" id="riskFilter">
                <span>Highlight At-Risk Schools Only</span>
            </label>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/data.js"></script>
    <script src="js/schools_near.js"></script>
    <script src="js/schools_far.js"></script>
    <script>
        const map = L.map('map', {
            zoomControl: false
        }).setView([17.0, -4.0], 6);

        L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; CARTO'
        }).addTo(map);

        // Layer Groups
        const conflictLayer = L.layerGroup().addTo(map);
        const atRiskSchoolsLayer = L.layerGroup().addTo(map);
        const safeSchoolsLayer = L.layerGroup().addTo(map);

        // 1. Load Conflicts
        conflictData.forEach(event => {
            const radius = Math.sqrt(event.damages) * 1.5 + 4;
            L.circleMarker([event.lat, event.lng], {
                radius: radius,
                color: '#e63946',
                weight: 1,
                fillColor: '#e63946',
                fillOpacity: 0.3
            }).bindPopup(`
                <div style="padding:5px">
                    <b style="color:#e63946">Conflict Incident</b><br>
                    <div style="margin-top:5px; font-size:12px">
                        <b>Cause:</b> ${event.cause}<br>
                        <b>Location:</b> ${event.location}<br>
                        <b>Fatalities:</b> ${event.damages}
                    </div>
                </div>
            `).addTo(conflictLayer);
        });

        // 2. Load At-Risk Schools
        schoolsNearConflict.features.forEach(f => {
            const coords = f.geometry.coordinates;
            L.circleMarker([coords[1], coords[0]], {
                radius: 6,
                color: '#fff',
                weight: 2,
                fillColor: '#800000',
                fillOpacity: 1,
                pane: 'markerPane'
            }).bindPopup(`
                <div style="padding:5px">
                    <b style="color:#800000">⚠️ AT-RISK SCHOOL</b><br>
                    <div style="margin-top:5px; font-size:12px">
                        <b>Name:</b> ${f.properties.name || 'Unnamed'}<br>
                        <b>Status:</b> Within 1km of conflict
                    </div>
                </div>
            `).addTo(atRiskSchoolsLayer);
        });

        // 3. Load Safe Schools
        schoolsFarFromConflict.features.forEach(f => {
            const coords = f.geometry.coordinates;
            L.circleMarker([coords[1], coords[0]], {
                radius: 4,
                color: '#fff',
                weight: 1.5,
                fillColor: '#457b9d',
                fillOpacity: 0.7
            }).bindPopup(`
                <div style="padding:5px">
                    <b style="color:#457b9d">Safe School</b><br>
                    <div style="margin-top:5px; font-size:12px">
                        <b>Name:</b> ${f.properties.name || 'Unnamed'}<br>
                        <b>Status:</b> Safe distance
                    </div>
                </div>
            `).addTo(safeSchoolsLayer);
        });

        // Legend
        const legend = L.control({position: 'bottomright'});
        legend.onAdd = function () {
            const div = L.DomUtil.create('div', 'legend');
            div.innerHTML = `
                <div class="legend-item"><i style="background: #e63946; opacity:0.4"></i> Conflict Incidents</div>
                <div class="legend-item"><i style="background: #800000"></i> At-Risk Schools (≤1km)</div>
                <div class="legend-item"><i style="background: #457b9d; opacity:0.7"></i> Safe Schools (>1km)</div>
            `;
            return div;
        };
        legend.addTo(map);

        document.getElementById('riskFilter').addEventListener('change', function(e) {
            if (e.target.checked) {
                map.removeLayer(safeSchoolsLayer);
                map.removeLayer(conflictLayer);
            } else {
                safeSchoolsLayer.addTo(map);
                conflictLayer.addTo(map);
            }
        });
    </script>
</body>
</html>
