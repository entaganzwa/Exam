<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Conflict Analysis - Dashboard</title>
    <!-- Simple explanation: We use Bootstrap for layout and Chart.js for the graphs -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .card-title { font-weight: bold; color: #333; }
        .header-section { padding: 40px 0; background: #2c3e50; color: white; margin-bottom: 40px; }
        canvas { max-height: 300px; }
    </style>
</head>
<body>

    <div class="header-section text-center">
        <h1>Conflict Trends & Impact Analysis</h1>
        <p>A data-driven view of global conflict events and their consequences</p>
        <a href="index.html" class="btn btn-outline-light btn-sm mt-2">Back to Portal</a>
    </div>

    <div class="container">
        <div class="row">
            <!-- (1) Top 10 Countries -->
            <div class="col-md-6">
                <div class="card p-4">
                    <h5 class="card-title text-center">Top 10 Countries by Events</h5>
                    <canvas id="countryChart"></canvas>
                </div>
            </div>

            <!-- (2) Regional Trends -->
            <div class="col-md-6">
                <div class="card p-4">
                    <h5 class="card-title text-center">Regional Trends (Africa)</h5>
                    <canvas id="regionChart"></canvas>
                </div>
            </div>

            <!-- (3) Category -->
            <div class="col-md-4">
                <div class="card p-4">
                    <h5 class="card-title text-center">Violence Categories</h5>
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>

            <!-- (4) Severity -->
            <div class="col-md-4">
                <div class="card p-4">
                    <h5 class="card-title text-center">Event Severity (Fatalities)</h5>
                    <canvas id="severityChart"></canvas>
                </div>
            </div>

            <!-- (5) Infrastructure -->
            <div class="col-md-4">
                <div class="card p-4">
                    <h5 class="card-title text-center">Damaged Infrastructure</h5>
                    <canvas id="infraChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Explanation: This script fetches the JSON data and tells Chart.js how to draw it.
        fetch('js/advanced_dashboard_data.json')
            .then(response => response.json())
            .then(data => {
                
                // 1. Country Chart
                new Chart(document.getElementById('countryChart'), {
                    type: 'bar',
                    data: {
                        labels: Object.keys(data.countries),
                        datasets: [{
                            label: 'Number of Events',
                            data: Object.values(data.countries),
                            backgroundColor: '#3498db'
                        }]
                    }
                });

                // 2. Region Chart (Line chart for trends over years)
                const africaData = data.regions['Africa'] || {};
                const years = Object.keys(africaData).sort();
                new Chart(document.getElementById('regionChart'), {
                    type: 'line',
                    data: {
                        labels: years,
                        datasets: [{
                            label: 'Africa Trend',
                            data: years.map(y => africaData[y]),
                            borderColor: '#e67e22',
                            fill: false
                        }]
                    }
                });

                // 3. Category Chart
                new Chart(document.getElementById('categoryChart'), {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(data.categories),
                        datasets: [{
                            data: Object.values(data.categories),
                            backgroundColor: ['#e74c3c', '#2ecc71', '#f1c40f']
                        }]
                    }
                });

                // 4. Severity Chart
                const sevOrder = ["Low (0)", "Medium (1-9)", "High (10-49)", "Critical (50+)"];
                new Chart(document.getElementById('severityChart'), {
                    type: 'bar',
                    data: {
                        labels: sevOrder,
                        datasets: [{
                            label: 'Frequency',
                            data: sevOrder.map(s => data.severity[s] || 0),
                            backgroundColor: '#9b59b6'
                        }]
                    }
                });

                // 5. Infrastructure Chart
                new Chart(document.getElementById('infraChart'), {
                    type: 'bar',
                    data: {
                        labels: Object.keys(data.infrastructure),
                        datasets: [{
                            label: 'Mentioned Damages',
                            data: Object.values(data.infrastructure),
                            backgroundColor: '#1abc9c'
                        }]
                    },
                    options: { indexAxis: 'y' } // Horizontal bar
                });
            });
    </script>
</body>
</html>
