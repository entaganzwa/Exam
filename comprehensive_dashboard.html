<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Conflict Analysis - Quad Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header-section { padding: 40px 0; background: #2c3e50; color: white; margin-bottom: 30px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); height: 100%; transition: transform 0.2s; }
        .card:hover { transform: translateY(-3px); }
        .card-title { font-weight: 700; color: #34495e; font-size: 1.1rem; border-bottom: 2px solid #ecf0f1; padding-bottom: 15px; margin-bottom: 20px; }
        canvas { max-height: 300px; }
    </style>
</head>
<body>

    <div class="header-section text-center">
        <h1>Global Conflict Metrics</h1>
        <p>A focused analysis of hotspots, regional trends, and incident severity</p>
        <a href="index.html" class="btn btn-outline-light btn-sm mt-2 rounded-pill px-4">Back to Portal</a>
    </div>

    <div class="container mb-5">
        <div class="row g-4">
            <!-- (1) Top 10 Countries Bar Chart -->
            <div class="col-md-6">
                <div class="card p-4">
                    <h5 class="card-title text-center">Top 10 Countries by Conflict Events</h5>
                    <canvas id="countryChart"></canvas>
                </div>
            </div>

            <!-- (2) Regional Trends Line Chart -->
            <div class="col-md-6">
                <div class="card p-4">
                    <h5 class="card-title text-center">Conflict Trends by Region (1989-2024)</h5>
                    <canvas id="regionChart"></canvas>
                </div>
            </div>

            <!-- (3) Events by Category Bar Chart -->
            <div class="col-md-6">
                <div class="card p-4">
                    <h5 class="card-title text-center">Total Events by Category</h5>
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>

            <!-- (4) Severity Bar Chart -->
            <div class="col-md-6">
                <div class="card p-4">
                    <h5 class="card-title text-center">Incident Severity (Fatality Distribution)</h5>
                    <canvas id="severityChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        fetch('js/advanced_dashboard_data.json')
            .then(response => response.json())
            .then(data => {
                
                // 1. Country Chart (Bar)
                new Chart(document.getElementById('countryChart'), {
                    type: 'bar',
                    data: {
                        labels: Object.keys(data.countries),
                        datasets: [{
                            label: 'Number of Events',
                            data: Object.values(data.countries),
                            backgroundColor: '#3498db',
                            borderRadius: 6
                        }]
                    },
                    options: { 
                        indexAxis: 'y',
                        plugins: { legend: { display: false } }
                    }
                });

                // 2. Region Chart (Line)
                const years = new Set();
                Object.values(data.regions).forEach(reg => Object.keys(reg).forEach(y => years.add(y)));
                const sortedYears = Array.from(years).sort();
                
                const datasets = Object.keys(data.regions).map((region, i) => ({
                    label: region,
                    data: sortedYears.map(y => data.regions[region][y] || 0),
                    borderColor: ['#e67e22', '#16a085', '#2980b9'][i % 3],
                    backgroundColor: ['#e67e22', '#16a085', '#2980b9'][i % 3],
                    tension: 0.3,
                    fill: false
                }));

                new Chart(document.getElementById('regionChart'), {
                    type: 'line',
                    data: { labels: sortedYears, datasets: datasets },
                    options: { 
                        responsive: true,
                        interaction: { intersect: false, mode: 'index' }
                    }
                });

                // 3. Category Chart (Bar)
                new Chart(document.getElementById('categoryChart'), {
                    type: 'bar',
                    data: {
                        labels: Object.keys(data.categories),
                        datasets: [{
                            label: 'Total Events',
                            data: Object.values(data.categories),
                            backgroundColor: ['#e74c3c', '#2ecc71', '#f1c40f'],
                            borderRadius: 6
                        }]
                    },
                    options: { 
                        plugins: { legend: { display: false } }
                    }
                });

                // 4. Severity Chart (Bar)
                const sevOrder = ["Low (0)", "Medium (1-9)", "High (10-49)", "Critical (50+)"];
                new Chart(document.getElementById('severityChart'), {
                    type: 'bar',
                    data: {
                        labels: sevOrder,
                        datasets: [{
                            label: 'Total Events',
                            data: sevOrder.map(s => data.severity[s] || 0),
                            backgroundColor: '#9b59b6',
                            borderRadius: 6
                        }]
                    },
                    options: { 
                        plugins: { legend: { display: false } }
                    }
                });
            });
    </script>
</body>
</html>
